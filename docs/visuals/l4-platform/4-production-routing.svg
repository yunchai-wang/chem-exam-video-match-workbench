  <polygon points="886,600 956,662 886,724 816,662" fill="#FFFFFF" stroke="#2AA88B" stroke-width="2"/>
  <text x="886" y="653" text-anchor="middle" font-size="17" font-weight="700" fill="#155D4D">课件方式</text>
  <text x="886" y="679" text-anchor="middle" font-size="13" fill="#397E6F">老师选择</text>

  <polyline points="956,636 1006,636 1006,603 1045,603" fill="none" stroke="#2AA88B" stroke-width="3"/>
  <polygon points="1045,603 1033,596 1033,610" fill="#2AA88B"/>
