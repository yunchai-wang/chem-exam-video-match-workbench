  <circle cx="112" cy="222" r="20" fill="#FFFFFF" opacity="0.22"/>
  <path d="M104 222 L111 229 L123 214" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="147" y="215" font-size="20" font-weight="700" fill="#FFFFFF">逐字稿已定稿</text>
  <text x="147" y="244" font-size="15" fill="#E9EEFF">题目、教案、原图均已锁定</text>
  <text x="147" y="268" font-size="15" fill="#E9EEFF">进入生产方式选择</text>

  <polyline points="340,231 402,231 402,258 451,258" fill="none" stroke="#7281A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="451,258 439,251 439,265" fill="#7281A0"/>
  <polygon points="520,180 610,258 520,336 430,258" fill="#FFFFFF" stroke="#7D89A6" stroke-width="2.5"/>
