  <rect x="0" y="0" width="1600" height="1080" fill="url(#bg)"/>
  <circle cx="1460" cy="90" r="170" fill="#DDEBFF" opacity="0.55"/>
  <circle cx="126" cy="960" r="150" fill="#D9F4EC" opacity="0.6"/>

  <text x="70" y="72" font-size="34" font-weight="700" fill="#18223A">逐字稿定稿后的生产路由</text>
  <text x="70" y="108" font-size="17" fill="#65718A">老师保留决策权 · 项目偏好可复用 · 自动化始终受质量门禁约束</text>
  <rect x="1285" y="54" width="245" height="54" rx="27" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2"/>
  <circle cx="1320" cy="81" r="16" fill="#E6EDFF"/>
  <path d="M1312 81 L1318 87 L1329 75" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1348" y="87" font-size="16" font-weight="600" fill="#3D4963">首次默认：生成后确认</text>

  <!-- 起点与主分叉 -->
