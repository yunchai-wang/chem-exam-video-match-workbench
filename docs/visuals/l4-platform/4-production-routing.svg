  <text x="1065" y="658" font-size="12" fill="#579485">少动画、少交互</text>

  <polyline points="956,688 1006,688 1006,721 1045,721" fill="none" stroke="#2AA88B" stroke-width="3"/>
  <polygon points="1045,721 1033,714 1033,728" fill="#2AA88B"/>
  <rect x="1045" y="684" width="220" height="87" rx="18" fill="#FFFFFF" stroke="#7CCDBA" stroke-width="2"/>
  <text x="1065" y="714" font-size="17" font-weight="700" fill="#155D4D">AI 完整互动模式</text>
  <text x="1065" y="740" font-size="14" fill="#397E6F">分镜＋交互＋反馈＋测试</text>
  <text x="1065" y="760" font-size="12" fill="#579485">少手写、AI为主</text>

  <polyline points="1265,623 1308,623 1308,676 1342,676" fill="none" stroke="#2AA88B" stroke-width="3"/>
  <polyline points="1265,727 1308,727 1308,676" fill="none" stroke="#2AA88B" stroke-width="3"/>
  <polygon points="1342,676 1330,669 1330,683" fill="#2AA88B"/>
  <rect x="1342" y="589" width="151" height="174" rx="20" fill="#F0FCF8" stroke="#37B596" stroke-width="2"/>
  <text x="1417" y="620" text-anchor="middle" font-size="16" font-weight="700" fill="#155D4D">AI 生产与校验</text>
  <text x="1417" y="649" text-anchor="middle" font-size="13" fill="#397E6F">科学性</text>
  <text x="1417" y="672" text-anchor="middle" font-size="13" fill="#397E6F">交互测试</text>
  <text x="1417" y="695" text-anchor="middle" font-size="13" fill="#397E6F">离线运行</text>
  <text x="1417" y="718" text-anchor="middle" font-size="13" fill="#397E6F">源码与验收报告</text>
  <rect x="1363" y="731" width="109" height="22" rx="11" fill="#0F9D8B"/>
  <text x="1417" y="747" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">回填飞书文档</text>

  <!-- 审核方式与生效范围控制面板 -->
  <rect x="70" y="380" width="570" height="400" rx="28" fill="#FFFFFF" stroke="#D7DFF0" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="100" y="426" font-size="21" font-weight="700" fill="#26324B">跨分支的两组项目设置</text>
  <text x="100" y="454" font-size="14" fill="#6D7890">PPT 与 HTML 均读取同一套偏好，老师可随时覆盖</text>

  <rect x="100" y="483" width="510" height="115" rx="20" fill="#F7F8FD" stroke="#DEE3F0"/>
  <circle cx="128" cy="515" r="15" fill="#E6E9FF"/>
  <text x="128" y="521" text-anchor="middle" font-size="15" font-weight="700" fill="#4F46E5">A</text>
  <text x="156" y="521" font-size="17" font-weight="700" fill="#313C55">自动化方式</text>
  <rect x="156" y="540" width="181" height="34" rx="17" fill="#4F46E5"/>
  <text x="246" y="562" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">生成后先让我确认</text>
  <text x="354" y="562" font-size="16" fill="#8B95A9">或</text>
  <rect x="385" y="540" width="194" height="34" rx="17" fill="#FFFFFF" stroke="#AAB5CB"/>
  <text x="482" y="562" text-anchor="middle" font-size="14" fill="#4E5970">校验通过后自动继续</text>

  <rect x="100" y="618" width="510" height="115" rx="20" fill="#F7F8FD" stroke="#DEE3F0"/>
  <circle cx="128" cy="650" r="15" fill="#E6E9FF"/>
  <text x="128" y="656" text-anchor="middle" font-size="15" font-weight="700" fill="#4F46E5">B</text>
  <text x="156" y="656" font-size="17" font-weight="700" fill="#313C55">生效范围</text>
  <rect x="156" y="676" width="108" height="34" rx="17" fill="#FFFFFF" stroke="#AAB5CB"/>
  <text x="210" y="698" text-anchor="middle" font-size="14" fill="#4E5970">仅本次</text>
  <rect x="278" y="676" width="160" height="34" rx="17" fill="#4F46E5"/>
  <text x="358" y="698" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">当前生产项目</text>
  <rect x="452" y="676" width="127" height="34" rx="17" fill="#FFFFFF" stroke="#AAB5CB"/>
  <text x="515" y="698" text-anchor="middle" font-size="14" fill="#4E5970">我的默认</text>
  <text x="100" y="760" font-size="13" fill="#707C93">优先级：仅本次 ＞ 当前生产项目 ＞ 个人默认</text>

  <!-- 门禁与异常 -->
  <polyline points="1167,482 1167,500 674,500 674,829 750,829" fill="none" stroke="#AF6170" stroke-width="3" stroke-dasharray="8 7"/>
  <polyline points="1167,780 1167,829 750,829" fill="none" stroke="#AF6170" stroke-width="3" stroke-dasharray="8 7"/>
  <polygon points="750,829 738,822 738,836" fill="#AF6170"/>
  <rect x="70" y="820" width="1450" height="190" rx="28" fill="url(#danger)" stroke="#E5A4A9" stroke-width="2"/>
  <circle cx="110" cy="862" r="19" fill="#D94D62"/>
  <text x="110" y="869" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">!</text>
  <text x="143" y="868" font-size="21" font-weight="700" fill="#7B2938">质量门禁优先于“自动继续”</text>
  <text x="143" y="896" font-size="14" fill="#955060">任一硬阻断命中 → 暂停当前分支 → 进入异常队列 → 保留上一确认版与原 PMO 状态</text>

  <rect x="100" y="923" width="222" height="52" rx="16" fill="#FFFFFF" stroke="#E2B2B6"/>
  <text x="211" y="946" text-anchor="middle" font-size="14" font-weight="600" fill="#7B2938">内容冲突 / 科学图风险</text>
  <text x="211" y="966" text-anchor="middle" font-size="12" fill="#A3616D">逐字稿、教案、原题不一致</text>
  <rect x="340" y="923" width="222" height="52" rx="16" fill="#FFFFFF" stroke="#E2B2B6"/>
  <text x="451" y="946" text-anchor="middle" font-size="14" font-weight="600" fill="#7B2938">素材缺失 / 许可不清</text>
  <text x="451" y="966" text-anchor="middle" font-size="12" fill="#A3616D">关键图表、版权、来源待确认</text>
  <rect x="580" y="923" width="222" height="52" rx="16" fill="#FFFFFF" stroke="#E2B2B6"/>
  <text x="691" y="946" text-anchor="middle" font-size="14" font-weight="600" fill="#7B2938">分镜或成品校验失败</text>
  <text x="691" y="966" text-anchor="middle" font-size="12" fill="#A3616D">结构、交互、离线测试未通过</text>
  <rect x="820" y="923" width="222" height="52" rx="16" fill="#FFFFFF" stroke="#E2B2B6"/>
  <text x="931" y="946" text-anchor="middle" font-size="14" font-weight="600" fill="#7B2938">PMO 负责人缺失</text>
  <text x="931" y="966" text-anchor="middle" font-size="12" fill="#A3616D">PPT 分支暂停，请老师选择</text>
  <rect x="1060" y="923" width="430" height="52" rx="16" fill="#7B2938"/>
  <text x="1090" y="946" font-size="14" font-weight="600" fill="#FFFFFF">处理后恢复原节点</text>
  <text x="1090" y="968" font-size="12" fill="#FFE6E9">幂等触发 · 通知去重 · 负责人变更留痕 · 不生成半完成交付</text>

  <text x="70" y="1045" font-size="13" fill="#718097">设置入口：资产页临时覆盖｜生产项目设置修改项目默认｜我的默认设置修改个人默认</text>
  <text x="1530" y="1045" text-anchor="end" font-size="12" fill="#98A3B7">L4 课程自进化平台 · 生产路由</text>
</svg>
