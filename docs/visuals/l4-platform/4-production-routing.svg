      <stop offset="0" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#EEF9F7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ppt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5E8"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <linearGradient id="html" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8FBF5"/>
      <stop offset="1" stop-color="#F8FFFD"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF1F2"/>
      <stop offset="1" stop-color="#FFF7ED"/>
