  <text x="886" y="313" text-anchor="middle" font-size="13" fill="#98652C">老师选择</text>

  <polyline points="956,270 1008,270 1008,236 1048,236" fill="none" stroke="#D0903F" stroke-width="3"/>
  <polygon points="1048,236 1036,229 1036,243" fill="#D0903F"/>
  <text x="994" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#A06420">直接交接</text>
  <rect x="1048" y="213" width="238" height="94" rx="18" fill="#FFFFFF" stroke="#E9B76D" stroke-width="2"/>
  <text x="1068" y="243" font-size="17" font-weight="700" fill="#6E4217">兼职直接制作</text>
  <text x="1068" y="269" font-size="14" fill="#805B35">定稿稿件＋原题＋已有素材</text>
  <text x="1068" y="291" font-size="14" fill="#805B35">＋基础交接清单</text>

  <polyline points="956,322 1008,322 1008,365 1048,365" fill="none" stroke="#D0903F" stroke-width="3"/>
  <polygon points="1048,365 1036,358 1036,372" fill="#D0903F"/>
  <text x="998" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#A06420">AI先设计</text>
  <rect x="1048" y="326" width="238" height="113" rx="18" fill="#FFFFFF" stroke="#E9B76D" stroke-width="2"/>
  <text x="1068" y="356" font-size="17" font-weight="700" fill="#6E4217">AI 深度设计</text>
  <text x="1068" y="382" font-size="14" fill="#805B35">逐页分镜＋清保增说明</text>
  <text x="1068" y="404" font-size="14" fill="#805B35">＋素材包＋制作提示</text>
  <rect x="1068" y="414" width="166" height="18" rx="9" fill="#FFF0D9"/>
  <text x="1151" y="427" text-anchor="middle" font-size="11" fill="#A06420">是否审核由项目偏好决定</text>

  <polyline points="1286,260 1323,260 1323,296 1355,296" fill="none" stroke="#D0903F" stroke-width="3"/>
  <polyline points="1286,382 1323,382 1323,296" fill="none" stroke="#D0903F" stroke-width="3"/>
  <polygon points="1355,296 1343,289 1343,303" fill="#D0903F"/>
  <rect x="1355" y="231" width="138" height="130" rx="20" fill="#FFF7E8" stroke="#E49D3D" stroke-width="2"/>
  <text x="1424" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#6E4217">飞书交接包</text>
  <text x="1424" y="286" text-anchor="middle" font-size="13" fill="#805B35">文档＋素材文件夹</text>
  <text x="1424" y="310" text-anchor="middle" font-size="13" fill="#805B35">PMO → 待制作 PPT</text>
  <rect x="1371" y="325" width="106" height="22" rx="11" fill="#F59E0B"/>
  <text x="1424" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">随后触达兼职</text>

  <rect x="744" y="390" width="274" height="67" rx="16" fill="#FFF7E8" stroke="#EBC78E" stroke-width="1.5"/>
  <circle cx="770" cy="423" r="13" fill="#F9D69D"/>
  <text x="770" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#8F571D">1</text>
  <text x="793" y="417" font-size="13" font-weight="600" fill="#6E4217">优先读取 PMO“兼职负责人”</text>
  <text x="793" y="439" font-size="12" fill="#98652C">字段已有值 → 直接定向触达</text>
  <rect x="1050" y="390" width="274" height="67" rx="16" fill="#FFF7E8" stroke="#EBC78E" stroke-width="1.5"/>
  <circle cx="1076" cy="423" r="13" fill="#F9D69D"/>
  <text x="1076" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#8F571D">2</text>
  <text x="1099" y="417" font-size="13" font-weight="600" fill="#6E4217">负责人为空 → 暂停并请老师选</text>
  <text x="1099" y="439" font-size="12" fill="#98652C">选择后再生成一次性通知</text>

  <!-- HTML 分支 -->
  <polyline points="588,286 658,286 658,560 715,560" fill="none" stroke="#0F9D8B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
