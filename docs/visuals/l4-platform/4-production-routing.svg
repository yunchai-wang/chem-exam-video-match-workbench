  <text x="520" y="279" text-anchor="middle" font-size="15" fill="#67738D">PPT / HTML</text>

  <!-- PPT 分支 -->
  <polyline points="588,230 658,230 658,188 715,188" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="715,188 702,181 702,195" fill="#F59E0B"/>
  <rect x="715" y="145" width="805" height="337" rx="30" fill="url(#ppt)" stroke="#F2C37D" stroke-width="2.5" filter="url(#cardShadow)"/>
  <rect x="744" y="170" width="92" height="36" rx="18" fill="#F59E0B"/>
  <text x="790" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">PPT</text>
