  <text x="78" y="116" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#D6E2FA">教师 · AI Agent · 飞书 Base 与工作流 · PMO 与兼职，在同一版本链和质量门上协作</text>
  <rect x="1452" y="63" width="262" height="48" rx="24" fill="#FFFFFF" opacity="0.12"/>
