  <text x="128" y="363" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1D478F">教研教师</text>
  <text x="128" y="390" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#526B96">确认边界 · 纠偏 · 验收</text>

  <rect x="246" y="275" width="202" height="118" rx="19" fill="#FFFFFF" stroke="#9CB9ED" stroke-width="2"/>
  <text x="265" y="305" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#244C91">创建生产项目</text>
  <text x="265" y="333" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#60708A">
    <tspan x="265" dy="0">选择资料入口、目标学生层</tspan>
    <tspan x="265" dy="22">确认字段映射与授权范围</tspan>
    <tspan x="265" dy="22">◇ F1 只复核异常项</tspan>
  </text>

  <rect x="508" y="275" width="210" height="118" rx="19" fill="#FFFFFF" stroke="#E2BD61" stroke-width="2"/>
  <text x="527" y="305" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#77550E">◇ F2 候选确认</text>
  <text x="527" y="333" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#60708A">
    <tspan x="527" dy="0">按整题 / 小问 / 选项选择</tspan>
    <tspan x="527" dy="22">校正缺口、好题与优先级</tspan>
    <tspan x="527" dy="22">可拆分、排除、批量通过</tspan>
  </text>

  <rect x="776" y="267" width="236" height="134" rx="19" fill="#FFFFFF" stroke="#B49BDF" stroke-width="2"/>
  <text x="795" y="297" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#5A348B">连续质量门</text>
  <text x="795" y="325" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#60708A">
    <tspan x="795" dy="0">◇ F3 母题 / 题组确认</tspan>
    <tspan x="795" dy="22">◇ F4 教案审核与多轮修改</tspan>
    <tspan x="795" dy="22">◇ F5 逐字稿审核与定稿</tspan>
    <tspan x="795" dy="22">可在工作台或 Word / 飞书深改</tspan>
  </text>

  <polygon points="1170,270 1252,334 1170,398 1088,334" fill="#FFF8EB" stroke="#F59E0B" stroke-width="2"/>
  <text x="1170" y="322" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#8A5B08">选择交付路径</text>
  <text x="1170" y="347" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#7E6741">PPT / HTML</text>
  <text x="1170" y="367" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#7E6741">确认 / 自动 · 生效范围</text>

  <rect x="1381" y="275" width="332" height="118" rx="19" fill="#FFFFFF" stroke="#9CB9ED" stroke-width="2"/>
  <text x="1400" y="305" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#244C91">◇ F6 / F7 验收与效果反馈</text>
  <text x="1400" y="333" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#60708A">
    <tspan x="1400" dy="0">确认分镜或成品；必要时退回</tspan>
    <tspan x="1400" dy="22">结合过程质量、观看和练习数据</tspan>
    <tspan x="1400" dy="22">首次认可后才询问保存项目自动模式</tspan>
  </text>

